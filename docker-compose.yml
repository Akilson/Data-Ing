  #     INFLUXDB_BUCKET: iot-analytics
  #     GRAFANA_URL: http://grafana:3000
  #     GRAFANA_API_KEY: admin
  #   restart: on-failure

volumes:
  grafana-storage:
    driver: local
  minio-storage:
    driver: local
  influxdb:
    driver: local
